name: images

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
  push:
    branches: [master]
    paths: [docker/**, .github/workflows/images.yml]

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: image ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-archlinux:${{ matrix.arch }}"
          docker build --pull --build-arg ARCH=${{ matrix.arch }} -t "$image" docker/archlinux/
          docker push "$image"
