name: test

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: ./in-builder.sh x86_64 nu -I /usr/share/nushell/modules -c 'use nutest; nutest run-tests --path tests --fail'
