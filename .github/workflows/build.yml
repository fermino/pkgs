name: build

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild every source
        type: boolean
        default: false
  push:
    branches: [master]
    paths: [config.toml]

# one run at a time: publish is the only writer of the repo
concurrency:
  group: repo
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_work: ${{ steps.plan.outputs.has_work }}
    steps:
      - uses: actions/checkout@v5
      - run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - id: plan
        env:
          RCLONE_CONFIG_REPO_TYPE: b2
          RCLONE_CONFIG_REPO_ACCOUNT: ${{ secrets.B2_KEY_ID }}
          RCLONE_CONFIG_REPO_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          RCLONE_CONFIG_REPO_HARD_DELETE: 'true'
        run: |
          ./in-builder.sh x86_64 nu builder.nu plan ${{ inputs.force && '--force' || '' }}
          echo "matrix=$(cat work/matrix.json)" >> "$GITHUB_OUTPUT"
          echo "has_work=$(cat work/has_work)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v5
        with:
          name: plan
          path: |
            work/plan.nuon
            work/sources
          include-hidden-files: true
          retention-days: 1

  build:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: plan
          path: work
      - run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: ./in-builder.sh ${{ matrix.image }} nu builder.nu build ${{ matrix.target }}
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: pkgs-${{ matrix.target }}
          path: |
            work/out/${{ matrix.target }}
            !work/out/${{ matrix.target }}/localbuild.*
          if-no-files-found: ignore
          retention-days: 1

  publish:
    needs: [plan, build]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.has_work == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: plan
          path: work
      - uses: actions/download-artifact@v5
        with:
          pattern: pkgs-*
          path: work/out
      - run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Secrets
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/secrets"
          printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/secrets/signing.key"
      - run: ./in-builder.sh x86_64 nu builder.nu publish
        env:
          RCLONE_CONFIG_REPO_TYPE: b2
          RCLONE_CONFIG_REPO_ACCOUNT: ${{ secrets.B2_KEY_ID }}
          RCLONE_CONFIG_REPO_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          RCLONE_CONFIG_REPO_HARD_DELETE: 'true'
